[project]
name = "deldesign"
version = "0.1.0"
description = "Reaction-constrained virtual DNA-encoded library design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rdkit>=2023.3", "numpy>=1.24"]

[project.scripts]
deldesign = "deldesign.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deldesign"]

[project.optional-dependencies]
# trained ADMET and toxicity models; pulls in PyTorch
models = ["admet_ai>=2.0"]
